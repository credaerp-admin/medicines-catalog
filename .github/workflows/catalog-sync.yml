name: 1mg Medicine Catalog SSOT Sync

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: medicine-catalog-public-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  detail-scrape:
    name: Scrape 1mg ${{ matrix.kind }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [drugs, otc]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scrape detail pages
        run: |
          mkdir -p output
          python3 scripts/scrape_1mg_details.py \
            "output/${{ matrix.kind }}-${{ matrix.shard }}.csv" \
            --kind "${{ matrix.kind }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 8 \
            --workers 4 \
            --delay 0.5 \
            --timeout 30 \
            --retries 3 \
            --retry-failed \
            --retry-partial
      - name: Upload detail shard
        uses: actions/upload-artifact@v4
        with:
          name: 1mg-detail-${{ matrix.kind }}-${{ matrix.shard }}
          path: output/${{ matrix.kind }}-${{ matrix.shard }}.csv
          retention-days: 7

  build-catalog:
    name: Validate and publish SSOT catalog
    needs: detail-scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download detail shards
        uses: actions/download-artifact@v4
        with:
          pattern: 1mg-detail-*
          path: output/shards
          merge-multiple: true
      - name: Inspect and prepare shards
        run: |
          mkdir -p output/shards
          find output/shards -mindepth 2 -type f -name "*.csv" -exec mv -f {} output/shards/ \;
          ls -la output/shards/
      - name: Calculate authoritative sitemap coverage
        id: coverage
        run: |
          EXPECTED=$(python3 - <<'PY'
          import requests
          from scripts.scrape_1mg_details import sitemap_urls
          session = requests.Session()
          print(len(sitemap_urls(session, 'drugs', 30)) + len(sitemap_urls(session, 'otc', 30)))
          PY
          )
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "1mg sitemap URLs expected: $EXPECTED"
      - name: Fail-closed merge and validation
        run: |
          mkdir -p output
          python3 scripts/build_1mg_catalog.py output/shards \
            --output output/medicines_latest.csv \
            --exceptions output/medicines_1mg_exceptions.csv \
            --expected-count "${{ steps.coverage.outputs.expected }}"
          python3 scripts/validate_1mg_catalog.py output/medicines_latest.csv
      - name: Write catalog manifest
        run: |
          python3 - <<'PY'
          import csv, hashlib, json, pathlib
          root = pathlib.Path('output')
          catalog = root / 'medicines_latest.csv'
          exceptions = root / 'medicines_1mg_exceptions.csv'
          def count(path):
              with path.open(newline='', encoding='utf-8') as f:
                  return max(0, sum(1 for _ in csv.DictReader(f)))
          manifest = {
              'source': 'https://www.1mg.com/sitemap.xml',
              'source_policy': 'detail-page-only; no cross-product fallback or guessed values',
              'catalog_file': catalog.name,
              'exception_file': exceptions.name,
              'published_rows': count(catalog),
              'source_exceptions': count(exceptions),
              'sha256': hashlib.sha256(catalog.read_bytes()).hexdigest(),
          }
          (root / 'medicines_1mg_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish SSOT catalog
        run: |
          cp output/medicines_latest.csv medicines_latest.csv
          cp output/medicines_1mg_exceptions.csv medicines_1mg_exceptions.csv
          cp output/medicines_1mg_manifest.json medicines_1mg_manifest.json
          git config user.name "CredaERP-1mg-Sync-Bot"
          git config user.email "bot@saitech-systems.com"
          git add medicines_latest.csv medicines_1mg_exceptions.csv medicines_1mg_manifest.json
          if git diff --staged --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Automated catalog update: $(date -u +%F)"
            git push origin HEAD:main
          fi
